name: Verify playable build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install CJK fonts for visual checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match 'Noto Sans CJK SC' | grep -q 'NotoSansCJK'
          fc-match 'Noto Serif CJK SC' | grep -q 'NotoSerifCJK'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:teaching-timing
      - run: npm run test:outlook-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterwave-playable-build
          path: |
            dist/
            playtest-output/
          retention-days: 14
