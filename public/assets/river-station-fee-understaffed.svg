<title>D4 river station: fee access, understaffed</title><desc>Original D4 river station artwork. The same existing station, river gauge, pier and stored records remain. An open payment register, coin tray and narrow service list identify fee access. Access is independent of staffing and maintenance. Empty duty slots show missing staff only. The roof is not depicted as broken. Operation and public access do not imply averted flood damage. Marks are illustrative, not numerical staffing or protection forecasts.</desc>
