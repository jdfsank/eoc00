<title>B4 library: closed preservation, failed_closed review</title>
<desc>Transparent 2:1 dimetric prop. Ground anchor 32,64. B4 monastery library, original fixed-location artwork. Preserved records: closed. Review workspace: failed_closed. The stepped-roof library remains open as a landmark. The separate left cabinet preserves differing old flood-level records; retention alone is not a corrected crisis or successful independent review. A tied broken-line folio retains failed history. A blank order means work is pending, never an accomplished check. Completed paired ledgers appear only after successful review; retained old failure is separate. Closing either service covers only its own furniture. No people, casualties, disaster ruins, future flood result, or numeric forecast is depicted. Paper marks are illustrative, not measured quantities.</desc>
