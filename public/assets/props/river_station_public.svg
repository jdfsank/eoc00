<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 64 80" shape-rendering="crispEdges" data-access="public" data-station-state="active" data-ground-anchor="32,64">
<title>D4 station: public access, active</title><desc>Transparent 2:1 dimetric prop. Ground anchor 32,64. Original D4 river station artwork. The same existing station, river gauge, pier and stored records remain. A broad public notice identifies public access, without a payment register or coin tray. Access is independent of staffing and maintenance. The duty board remains fully occupied. The roof is not depicted as broken. Operation and public access do not imply averted flood damage. Marks are illustrative, not numerical staffing or protection forecasts.</desc>
