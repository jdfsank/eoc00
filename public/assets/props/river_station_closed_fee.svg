<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 64 80" shape-rendering="crispEdges" data-access="fee" data-station-state="stopped" data-ground-anchor="32,64">
<title>D4 station: fee access, stopped</title><desc>Transparent 2:1 dimetric prop. Ground anchor 32,64. Original D4 river station artwork. The same existing station, river gauge, pier and stored records remain. An open payment register, coin tray and narrow service list identify fee access. Access is independent of staffing and maintenance. The station is closed, records remain, and the lamp is unlit. The old access furniture is retained but crossed and bound; no public or fee service continues. Marks are illustrative, not numerical staffing or protection forecasts.</desc>
