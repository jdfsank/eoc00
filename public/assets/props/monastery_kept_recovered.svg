<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 64 80" shape-rendering="crispEdges" data-archive="kept" data-review="recovered" data-ground-anchor="32,64">
<title>B4 library: kept preservation, recovered review</title>
<desc>Transparent 2:1 dimetric prop. Ground anchor 32,64. B4 monastery library, original fixed-location artwork. Preserved records: kept. Review workspace: recovered. The stepped-roof library remains open as a landmark. The separate left cabinet preserves differing old flood-level records; retention alone is not a corrected crisis or successful independent review. A tied broken-line folio retains failed history. A blank order means work is pending, never an accomplished check. Completed paired ledgers appear only after successful review; retained old failure is separate. Closing either service covers only its own furniture. No people, casualties, disaster ruins, future flood result, or numeric forecast is depicted. Paper marks are illustrative, not measured quantities.</desc>
