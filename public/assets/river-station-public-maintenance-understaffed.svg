<title>D4 river station: public access, maintenance-understaffed</title><desc>Original D4 river station artwork. The same existing station, river gauge, pier and stored records remain. A broad public notice identifies public access, without a payment register or coin tray. Access is independent of staffing and maintenance. A roof repair patch shows maintenance needs only. Empty duty slots show missing staff only. Operation and public access do not imply averted flood damage. Marks are illustrative, not numerical staffing or protection forecasts.</desc>
